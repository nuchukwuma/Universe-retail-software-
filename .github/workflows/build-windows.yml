# Builds the Windows installer (Universe-POS-Setup-x.y.z.exe) on a
# Windows computer at GitHub. When it finishes, download it from the
# "Actions" tab: open the run, then "Artifacts" -> Universe-POS-Setup.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - 'desktop/**'
      - '.github/workflows/build-windows.yml'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the app's screens (client)
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Install the desktop app's packages
        working-directory: desktop
        run: npm ci

      - name: Build the installer
        working-directory: desktop
        run: |
          npm run copy-app
          npx electron-builder --win nsis --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: Universe-POS-Setup
          path: desktop/dist/*.exe
          retention-days: 30
