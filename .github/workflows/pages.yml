# Publishes the website on GitHub Pages: the landing page (site/) and the
# browser demo (site/demo, built from the real client and server code).
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Website

on:
  workflow_dispatch:
  push:
    branches:
      - hordedesk
    paths:
      - 'site/**'
      - 'client/**'
      - 'server/**'
      - 'demo/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install packages
        run: |
          npm ci --prefix server --omit=dev
          npm ci --prefix client

      - name: Build the browser demo
        working-directory: client
        run: npm run build:demo

      - name: Put the site together
        run: |
          mkdir -p _site
          cp -r site/index.html site/styles.css site/favicon.svg site/images site/demo _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
