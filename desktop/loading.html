<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>HordeDesk</title>
  <style>
    body {
      display: grid;
      place-items: center;
      height: 100vh;
      margin: 0;
      background: #f2f4f7;
      color: #111827;
      font-family: 'Segoe UI', Arial, sans-serif;
    }
    .mark { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    img { width: 72px; height: 72px; }
    p { margin: 0; color: #545e6e; font-size: 15px; }
    .bar { width: 160px; height: 4px; overflow: hidden; border-radius: 4px; background: #e4e7ec; }
    .bar span { display: block; width: 40%; height: 100%; border-radius: 4px; background: #3346d3; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!-- Shown while the app opens the shop's data (a second or two). -->
  <div class="mark">
    <img src="build/icon.png" alt="" />
    <div class="bar" aria-hidden="true"><span></span></div>
    <p>Starting HordeDesk</p>
  </div>
</body>
</html>
